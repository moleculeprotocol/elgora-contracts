name: Contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - name: Check out source and pinned dependencies
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.5.1
          cache: false
      - name: Build
        run: forge build
      - name: Run unit and invariant tests
        run: forge test --no-match-path 'test/fork/*'
