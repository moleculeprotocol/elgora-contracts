[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.36"
evm_version = "cancun"
via_ir = false
optimizer = true
optimizer_runs = 200
ignored_warnings_from = ["lib"]
ignored_error_codes = [6335]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "openzeppelin-contracts/=lib/openzeppelin-contracts/"
]

[rpc_endpoints]
base_sepolia = "${ELGORA_BASE_SEPOLIA_RPC_URL}"

[invariant]
runs = 64
depth = 32
fail_on_revert = false

[profile.ci.invariant]
runs = 256
depth = 64
fail_on_revert = false

[fmt]
line_length = 100
